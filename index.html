<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My GitHub Pages Site</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f6f8fa;
      color: #24292f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 600px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      color: #57606a;
      margin-bottom: 1.5rem;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: #0969da;
      color: white;
      border-radius: 20px;
      font-size: 0.9rem;
      text-decoration: none;
    }

    .badge:hover {
      background: #0550ae;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Hello, World!</h1>
    <p>This page is live on GitHub Pages. Edit <code>index.html</code> to make it yours.</p>
    <a class="badge" href="https://pages.github.com/" target="_blank" rel="noopener">Learn about GitHub Pages</a>
  </div>
</body>
</html>
