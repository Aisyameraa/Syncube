<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logged out</title>
<style>
  :root {
    --ink: #1f2421;
    --paper: #f6f5f1;
    --line: #d8d5cc;
    --accent: #2f6f4f;
    --muted: #6b6f68;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Georgia", serif;
    padding: 24px;
  }
  .card {
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  .mark {
    width: 48px;
    height: 48px;
    margin: 0 auto 28px;
    border: 1.5px solid var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mark svg { width: 20px; height: 20px; stroke: var(--accent); }
  h1 {
    font-size: 1.5rem;
    font-weight: 500;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }
  p {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 0.95rem;
    color: var(--muted);
    line-height: 1.5;
    margin: 0 0 32px;
  }
  a.btn {
    display: inline-block;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--paper);
    background: var(--ink);
    text-decoration: none;
    padding: 12px 28px;
    border-radius: 4px;
    transition: opacity 0.15s ease;
  }
  a.btn:hover { opacity: 0.85; }
  a.btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    a.btn { transition: none; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5" />
      </svg>
    </div>
    <h1>You've been logged out</h1>
    <p>Your session has ended. Log back in whenever you're ready.</p>
    <a class="btn" href="auth.php">Log back in</a>
  </div>
</body>
</html>
